name: CinematicEngine
version: 1.2.0-SNAPSHOT
main: com.darkbladedev.cinematic.bootstrap.CinematicEnginePlugin
api-version: "1.20"
depend:
  - packetevents
commands:
  cinematic:
    description: Comando raíz del motor de cinemáticas
    usage: /cine <subcomando>
    aliases:
      - cine
permissions:
  cinematic.help:
    default: true
  cinematic.list:
    default: true
  cinematic.play:
    default: op
  cinematic.pause:
    default: op
  cinematic.resume:
    default: op
  cinematic.stop:
    default: op
  cinematic.reload:
    default: op
